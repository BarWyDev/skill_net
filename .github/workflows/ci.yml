name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token: no job writes to the repository (security audit F-13).
permissions:
  contents: read

# Actions are pinned by commit SHA (security audit F-13); Dependabot (.github/dependabot.yml) proposes
# updates, with the tag in the comment.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 24 strips TypeScript natively, which `npm run test:unit` relies on.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run test:unit
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Pinned, like the actions: `latest` let a new CLI change a run without a commit.
          version: 2.120.0
      - run: npm ci
      # A runner once had 54322 already bound, so `supabase start` failed before any app code ran.
      # Free the API and DB ports (the only ones the start below publishes) first.
      - name: Free local Supabase ports
        run: |
          for port in 54321 54322; do
            docker ps -q --filter "publish=$port" | xargs -r docker rm -f
            sudo fuser -k "$port/tcp" || true
          done
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Run database tests
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Advisories in the dependencies the Worker ships. Not a required check, so a new advisory does not
  # block an unrelated merge; a red run here means `npm audit fix` (security audit F-13).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
